[project]
name = "wick-backend"
version = "0.1.0"
description = "Local crypto market-data streaming service (read-only, no keys)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
